<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06263b">
<title>O3Life | One Ocean · One Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#03111c;--deep:#06263b;--deep2:#0a3550;--aqua:#5eead4;--teal:#14b8a6;--blue:#67d1ff;--text:#eaf7f7;--muted:#8fb2bb;--glass:rgba(255,255,255,.06);--border:rgba(210,255,250,.15);--danger:#fb7185;--amber:#fbbf24;--green:#34d399}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,var(--bg),var(--deep) 60%,#041722);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh}h1,h2,h3{font-family:Sora,Inter,sans-serif;color:#f7fffe}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.wrap{width:min(1180px,calc(100% - 30px));margin:auto}
header{position:sticky;top:0;z-index:100;background:rgba(3,17,28,.86);backdrop-filter:blur(15px);border-bottom:1px solid var(--border)}.top{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{font:800 1.3rem Sora;color:#fff}.brand span{display:block;font:600 .62rem Inter;color:var(--aqua);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}nav{display:flex;gap:4px;flex-wrap:wrap}nav button{border:0;background:transparent;color:#dff8f6;padding:9px 11px;border-radius:9px;font-weight:600}nav button:hover,nav button.active{background:rgba(94,234,212,.12);color:var(--aqua)}.user-label{color:var(--aqua);font-size:.85rem;font-weight:600}
main{min-height:calc(100vh - 180px)}.section{padding:42px 0}.hero{padding:80px 0 55px}.eyebrow{display:inline-block;border:1px solid var(--border);background:var(--glass);padding:7px 13px;border-radius:99px;color:var(--aqua);font-size:.8rem;font-weight:700}.hero h1{font-size:clamp(2.2rem,6vw,4.3rem);line-height:1.05;max-width:850px;margin:18px 0}.grad{color:var(--aqua)}.hero p{max-width:700px;color:var(--muted);font-size:1.08rem;line-height:1.7}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.btn{border:1px solid transparent;border-radius:11px;padding:12px 18px;font-weight:700}.primary{background:linear-gradient(120deg,var(--teal),#0e93a8);color:#022026}.secondary{background:var(--glass);color:#eafffb;border-color:var(--border)}.danger{background:rgba(251,113,133,.12);color:#ffb4bf;border-color:rgba(251,113,133,.35)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:var(--glass);border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.2)}.stat strong{display:block;font:800 2rem Sora;color:var(--aqua)}.stat span,.muted{color:var(--muted)}.notice{padding:12px 14px;border-radius:10px;margin:12px 0;font-weight:600}.notice.info{background:rgba(94,234,212,.08);color:var(--aqua)}.notice.success{background:rgba(52,211,153,.1);color:#8bf3c4}.notice.error{background:rgba(251,113,133,.1);color:#ffb4bf}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px;font-size:.86rem;font-weight:700}.field.full{grid-column:1/-1}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(150,220,220,.22);background:rgba(4,22,32,.65);color:#fff;outline:none}textarea{min-height:120px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--aqua);box-shadow:0 0 0 3px rgba(94,234,212,.12)}input[type=file]{padding:9px}.hint{font-size:.76rem;color:var(--muted);font-weight:500}.preview{max-width:260px;max-height:180px;border-radius:12px;border:1px solid var(--border);display:block;margin-top:8px;object-fit:cover}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid rgba(255,255,255,.08);vertical-align:top}th{font-size:.74rem;color:var(--aqua);text-transform:uppercase;letter-spacing:.05em}.badge{display:inline-block;border:1px solid rgba(94,234,212,.25);background:rgba(94,234,212,.12);color:var(--aqua);padding:4px 9px;border-radius:99px;font-size:.74rem;font-weight:700}.badge.Resolved{color:#8bf3c4;background:rgba(52,211,153,.1)}.badge.Verified{color:#9fdcff;background:rgba(103,209,255,.1)}.badge.Assigned{color:#ffd479;background:rgba(251,191,36,.1)}
.map{height:560px;border-radius:18px;overflow:hidden;border:1px solid var(--border);background:#08202c}.map-list{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.report-card{cursor:pointer}.report-card img{width:100%;height:170px;object-fit:cover;border-radius:12px;margin-bottom:12px;background:#06263b}.report-card .no-photo{height:170px;border-radius:12px;background:linear-gradient(135deg,#06263b,#0a4a63);display:flex;align-items:center;justify-content:center;color:var(--muted);margin-bottom:12px}.photo-note{font-size:.74rem;color:var(--muted)}.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}.tabs button{border:1px solid var(--border);background:var(--glass);color:#fff;padding:9px 13px;border-radius:9px;font-weight:700}.tabs button.active{background:var(--teal);color:#022026}.empty{text-align:center;padding:35px;color:var(--muted);border:1px dashed var(--border);border-radius:14px}
footer{padding:25px 0 35px;color:var(--muted);border-top:1px solid rgba(255,255,255,.06);margin-top:40px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.map-list{grid-template-columns:1fr 1fr}}@media(max-width:640px){.grid,.form-grid,.map-list{grid-template-columns:1fr}.field.full{grid-column:auto}.top{align-items:flex-start}.hero{padding-top:50px}.map{height:430px}nav button{padding:8px 7px;font-size:.8rem}}
</style>
</head>
<body>
<header><div class="wrap top">
  <div class="brand">🌊 O3Life<span>One Ocean · One Life</span></div>
  <nav id="nav">
    <button data-page="home">Home</button><button data-page="map">Live Map</button><button data-page="dashboard">Dashboard</button>
    <button data-page="report">Report</button><button data-page="reports">Track Reports</button><button data-page="account">Account</button>
    <button data-page="employee" id="employeeNav" class="hidden">Employee</button><button data-page="admin" id="adminNav" class="hidden">Admin</button><button id="loginNav">Login</button><button id="logoutNav" class="hidden">Logout</button>
  </nav>
  <span id="userLabel" class="user-label"></span>
</div></header>
<main id="app" class="wrap"></main>
<footer><div class="wrap"><b>O3Life</b> · Citizen science for a healthier coast · Ocean Hackathon Chennai 2026</div></footer>

<script>
(() => {
'use strict';

/* Put your restricted Google Maps browser key here. Do not use an unrestricted key. */
const GOOGLE_MAPS_API_KEY = 'AIzaSyAIQCcyOi0wOeCHGl17JhTPnPWFYmJ4leE';

const state={user:null,reports:[],dashboard:{},beaches:[],page:'home'};
const app=document.querySelector('#app'), nav=document.querySelector('#nav');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=(o,...keys)=>{for(const k of keys)if(o&&o[k]!==undefined&&o[k]!==null)return o[k];return''};
const isAdmin=()=>String(val(state.user,'role')).toLowerCase()==='admin';
const isEmployee=()=>['employee','admin'].includes(String(val(state.user,'role')).toLowerCase());

async function api(path,opts={}){
  const options={credentials:'same-origin',...opts,headers:{Accept:'application/json',...(opts.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opts.headers||{})}};
  const r=await fetch(path,options);let d={};try{d=await r.json()}catch(_){}
  if(!r.ok)throw new Error(val(d,'error','message')||`Request failed (${r.status})`);
  return d;
}
function notice(t,type='info'){return `<div class="notice ${type}">${esc(t)}</div>`}
function layout(html){app.innerHTML=html;setNav();window.scrollTo({top:0,behavior:'smooth'})}
function setNav(){
 document.querySelector('#loginNav').classList.toggle('hidden',!!state.user);
 document.querySelector('#logoutNav').classList.toggle('hidden',!state.user);
 document.querySelector('#adminNav').classList.toggle('hidden',!isAdmin());
 document.querySelector('#employeeNav').classList.toggle('hidden',!isEmployee());
 document.querySelector('#userLabel').textContent=state.user?`${esc(state.user.name)}${isAdmin()?' · Admin':''}`:'';
 document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
}
async function loadSession(){try{const d=await api('/api/auth/me');state.user=d.user||null}catch(_){state.user=null}setNav()}
async function loadReports(){state.reports=await api('/api/reports')}
async function loadDashboard(){state.dashboard=await api('/api/dashboard')}
async function loadBeaches(){if(!state.beaches.length)state.beaches=await api('/api/beaches')}

function requireLogin(){if(!state.user){go('login');return false}return true}

/* HOME */
async function home(){
 state.page='home';
 layout(`<section class="hero"><span class="eyebrow">● Live citizen-science platform</span>
 <h1>Protect <span class="grad">Chennai's coast</span> through real community reports.</h1>
 <p>Report pollution, wildlife concerns and coastal hazards with a beach, location, coordinates and your own photo. Every mapped report can be opened on the live map.</p>
 <div class="actions"><button class="btn primary" data-go="report">Report an issue</button><button class="btn secondary" data-go="map">View live map</button></div></section>
 <section class="section"><h2>O3Life impact</h2><p class="muted">These numbers come from your Flask/MySQL database.</p><div id="stats" class="grid">${[1,2,3,4].map(()=>'<div class="card stat"><strong>…</strong><span>Loading</span></div>').join('')}</div></section>
 <section class="section"><div class="split">
 <div class="card"><h3>📍 Beach-specific reporting</h3><p class="muted">Choose the exact beach, keep its coordinates, and place the report at that location on Google Maps.</p></div>
 <div class="card"><h3>✅ Community verification</h3><p class="muted">Employees verify reports. The public can also vote whether a report appears true or false.</p></div>
 </div></section>`);
 try{await Promise.all([loadReports(),loadDashboard()]);const d=state.dashboard;
 document.querySelector('#stats').innerHTML=`<div class="card stat"><strong>${d.total||0}</strong><span>Total reports</span></div><div class="card stat"><strong>${d.active||0}</strong><span>Active</span></div><div class="card stat"><strong>${d.resolved||0}</strong><span>Resolved</span></div><div class="card stat"><strong>${d.contributors||0}</strong><span>Contributors</span></div>`;
 }catch(e){document.querySelector('#stats').innerHTML=notice(e.message,'error')}
}

/* AUTH */
function login(){
 state.page='login';layout(`<section class="section split"><div><h1>Welcome to O3Life</h1><p class="muted">Create an account or sign in to submit real coastal observations.</p></div>
 <div class="card"><div class="tabs"><button class="active" data-auth="login">Login</button><button data-auth="register">Create account</button></div><div id="authForm"></div></div></section>`);renderAuth('login')
}
function renderAuth(mode){
 const el=document.querySelector('#authForm');
 el.innerHTML=mode==='login'?`<form id="authFormActual" class="form-grid"><label class="field full">Email<input required type="email" name="email"></label><label class="field full">Password<input required type="password" name="password"></label><button class="btn primary full">Login</button><div id="authMsg" class="field full"></div></form>`
 :`<form id="authFormActual" class="form-grid"><label class="field full">Name<input required name="name"></label><label class="field full">Email<input required type="email" name="email"></label><label class="field full">Password<input required minlength="6" type="password" name="password"></label><button class="btn primary full">Create account</button><div id="authMsg" class="field full"></div></form>`;
 document.querySelectorAll('[data-auth]').forEach(b=>b.classList.toggle('active',b.dataset.auth===mode));
 document.querySelector('#authFormActual').addEventListener('submit',async e=>{
  e.preventDefault();const f=e.currentTarget,b=f.querySelector('button'),out=document.querySelector('#authMsg');b.disabled=true;
  try{const body=Object.fromEntries(new FormData(f));const d=await api(`/api/auth/${mode}`,{method:'POST',body:JSON.stringify(body)});state.user=d.user;setNav();go('home')}catch(err){out.innerHTML=notice(err.message,'error')}finally{b.disabled=false}
 })
}

/* REPORT */
async function reportPage(){
 if(!requireLogin())return;state.page='report';await loadBeaches();
 layout(`<section class="section"><h1>Report a coastal issue</h1><p class="muted">Select the beach. Its coordinates will be used for the map pin. Add the photo you actually observed.</p>
 <div class="card"><form id="reportForm" class="form-grid">
 <label class="field">Category<select name="category" required><option value="">Choose</option><option>Marine Mammal Sighting</option><option>Marine Wildlife</option><option>Stranding</option><option>Plastic Pollution</option><option>Beach Waste</option><option>Oil Spill</option><option>Water Quality</option><option>Habitat Damage</option><option>Other</option></select></label>
 <label class="field">Severity<select name="severity" required><option value="">Choose</option><option>Low</option><option>Medium</option><option>High</option></select></label>
 <label class="field full">Beach<select id="beachSelect" name="beach_name" required><option value="">Select a beach</option>${state.beaches.map(b=>`<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('')}<option value="Other location">Other location</option></select></label>
 <label class="field">Latitude<input id="lat" name="latitude" type="number" step="any" readonly><span class="hint">Filled from selected beach.</span></label>
 <label class="field">Longitude<input id="lng" name="longitude" type="number" step="any" readonly><span class="hint">Filled from selected beach.</span></label>
 <label class="field full">Location / landmark<input name="location" required placeholder="Example: near the north entrance"></label>
 <label class="field full">Observation<textarea name="description" required placeholder="What did you observe?"></textarea></label>
 <label class="field full">Photo <span class="hint">JPG, PNG or WEBP · maximum 8 MB</span><input id="photo" type="file" name="photo" accept="image/jpeg,image/png,image/webp"><img id="preview" class="preview hidden" alt="Selected photo preview"></label>
 <button class="btn primary">Submit report</button><div id="reportMsg"></div>
 </form></div></section>`);
 const f=document.querySelector('#reportForm');
 document.querySelector('#beachSelect').addEventListener('change',e=>{const b=state.beaches.find(x=>x.name===e.target.value);document.querySelector('#lat').value=b?b.latitude:'';document.querySelector('#lng').value=b?b.longitude:''});
 document.querySelector('#photo').addEventListener('change',e=>{const file=e.target.files[0],img=document.querySelector('#preview');if(!file){img.classList.add('hidden');return}img.src=URL.createObjectURL(file);img.classList.remove('hidden')});
 f.addEventListener('submit',async e=>{
  e.preventDefault();const b=e.currentTarget.querySelector('button'),out=document.querySelector('#reportMsg');b.disabled=true;
  try{const form=new FormData(f);const file=document.querySelector('#photo').files[0];if(file&&file.size>8*1024*1024)throw new Error('Image is too large. Maximum size is 8 MB.');const d=await api('/api/reports',{method:'POST',body:form});out.innerHTML=notice(`Report submitted: ${d.id}. It is now visible on the map.`,'success');f.reset();document.querySelector('#preview').classList.add('hidden');await loadReports()}catch(err){out.innerHTML=notice(err.message,'error')}finally{b.disabled=false}
 })
}

/* REPORT LIST */
async function reportsPage(){
 state.page='reports';layout(`<section class="section"><h1>Public coastal reports</h1><p class="muted">Community reports are visible here. Employees verify them, while the public can vote whether each report appears true or false.</p><div class="card"><form id="track" class="actions"><input name="id" required placeholder="O3L-2026-00001"><button class="btn secondary">Find</button></form><div id="tracked"></div></div><div class="section"><h2>Community reports</h2><div id="list"></div></div></section>`);
 document.querySelector('#track').addEventListener('submit',async e=>{e.preventDefault();try{const d=await api('/api/reports/'+encodeURIComponent(new FormData(e.currentTarget).get('id')));document.querySelector('#tracked').innerHTML=detail(d)}catch(err){document.querySelector('#tracked').innerHTML=notice(err.message,'error')}});
 try{await loadReports();drawList()}catch(e){document.querySelector('#list').innerHTML=notice(e.message,'error')}
}
function photoHTML(r){return r.image_url?`<img src="${esc(r.image_url)}" alt="Photo submitted for ${esc(r.beach_name||r.location)}" loading="lazy">`:`<div class="no-photo">No photo submitted</div>`}
function voteButtons(r){return `<div class="vote-row"><button class="btn secondary" data-vote-id="${esc(r.id)}" data-vote="true">👍 True (${r.true_votes||0})</button><button class="btn secondary" data-vote-id="${esc(r.id)}" data-vote="false">👎 False (${r.false_votes||0})</button></div>`}
function reportCard(r,withPhoto=true){return `<div class="card report-card" data-report="${esc(r.id)}">${withPhoto?photoHTML(r):''}<h3>${esc(r.id)}</h3><b>${esc(r.category)}</b><p class="muted">${esc(r.beach_name||r.location)}</p><p class="muted">${esc(r.description)}</p><div><span class="badge ${esc(r.verification_status)}">Employee: ${esc(r.verification_status)}</span> <span class="badge">Community: ${esc(r.community_verdict)}</span></div>${voteButtons(r)}</div>`}
function detail(r){return `<div class="card" style="margin-top:15px"><h3>${esc(r.id)}</h3>${photoHTML(r)}<p><b>${esc(r.category)}</b> · ${esc(r.beach_name||r.location)}</p><p class="muted">${esc(r.description)}</p><div><span class="badge ${esc(r.verification_status)}">Employee: ${esc(r.verification_status)}</span> <span class="badge">Community: ${esc(r.community_verdict)}</span></div>${voteButtons(r)}</div>`}
function drawList(){const el=document.querySelector('#list');if(!state.reports.length){el.innerHTML='<div class="empty">No reports in the database.</div>';return}el.innerHTML=`<div class="map-list">${state.reports.map(r=>reportCard(r,true)).join('')}</div>`}
async function voteReport(id,vote){try{await api('/api/reports/'+encodeURIComponent(id)+'/vote',{method:'POST',body:JSON.stringify({vote})});await loadReports();drawList();alert('Your vote was recorded.')}catch(e){alert(e.message)}}

/* EMPLOYEE */
async function employeePage(){if(!isEmployee()){go('home');return}state.page='employee';layout(`<section class="section"><h1>Employee verification</h1><p class="muted">Review community reports and decide whether each report is true or false.</p><div id="employeeContent" class="grid"></div></section>`);await loadReports();renderEmployee()}
function renderEmployee(){const el=document.querySelector('#employeeContent');const pending=state.reports.filter(r=>r.verification_status==='Pending');if(!pending.length){el.innerHTML='<div class="empty">No reports waiting for verification.</div>';return}el.innerHTML=pending.map(r=>`<div class="card">${photoHTML(r)}<h3>${esc(r.id)}</h3><b>${esc(r.category)}</b><p class="muted">${esc(r.beach_name||r.location)} · ${esc(r.location)}</p><p>${esc(r.description)}</p>${r.image_url?'':'<p class="muted">No photo attached.</p>'}<div class="actions"><button class="btn primary" data-verify-id="${esc(r.id)}" data-decision="true">✅ Verify true</button><button class="btn secondary" data-verify-id="${esc(r.id)}" data-decision="false">❌ Mark false</button></div></div>`).join('')}
async function verifyReport(id,decision){try{await api('/api/employee/reports/'+encodeURIComponent(id)+'/verify',{method:'PUT',body:JSON.stringify({decision})});await loadReports();renderEmployee()}catch(e){alert(e.message)}}

/* MAP */
function loadMapsScript(){
 return new Promise((resolve,reject)=>{if(window.google?.maps)return resolve();if(GOOGLE_MAPS_API_KEY.startsWith('PASTE_'))return reject(new Error('Add your restricted Google Maps JavaScript API key in this HTML file.'));const s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(GOOGLE_MAPS_API_KEY)+'&v=weekly';s.async=true;s.onload=resolve;s.onerror=()=>reject(new Error('Google Maps failed to load. Check Maps JavaScript API and key restrictions.'));document.head.appendChild(s)})
}
async function mapPage(){
 state.page='map';layout(`<section class="section"><h1>Live coastal report map</h1><p class="muted">A marker is created only when the report has real coordinates. Click a marker to see the reporter's uploaded photo.</p><div id="mapMsg"></div><div id="map" class="map"></div><div id="mapCards" class="section"></div></section>`);
 try{await loadReports();const mapped=state.reports.filter(r=>Number.isFinite(Number(r.latitude))&&Number.isFinite(Number(r.longitude)));await loadMapsScript();const map=new google.maps.Map(document.querySelector('#map'),{center:{lat:13.0827,lng:80.2707},zoom:10,mapTypeControl:false,streetViewControl:false,fullscreenControl:true});const bounds=new google.maps.LatLngBounds();
 mapped.forEach(r=>{const pos={lat:Number(r.latitude),lng:Number(r.longitude)};const marker=new google.maps.Marker({map,position:pos,title:r.beach_name||r.location});const photo=r.image_url?`<img src="${esc(r.image_url)}" style="width:220px;height:130px;object-fit:cover;border-radius:8px" alt="Submitted report photo">`:`<div style="width:220px;height:80px;background:#e8f4f3;border-radius:8px;display:flex;align-items:center;justify-content:center">No photo submitted</div>`;const info=new google.maps.InfoWindow({content:`<div style="color:#06263b;font-family:Arial;max-width:230px">${photo}<h3 style="margin:8px 0 4px">${esc(r.category)}</h3><b>${esc(r.beach_name||r.location)}</b><div>Status: ${esc(r.status)}</div><div>Severity: ${esc(r.severity)}</div><p style="font-size:12px">${esc(r.description)}</p></div>`});marker.addListener('click',()=>info.open({anchor:marker,map}));bounds.extend(pos)});
 if(mapped.length)map.fitBounds(bounds,60);else document.querySelector('#mapMsg').innerHTML=notice('No mapped reports yet. Submit a report with a selected beach to create the first marker.','info');
 document.querySelector('#mapCards').innerHTML=state.reports.length?`<h2>Reported locations</h2><div class="map-list">${state.reports.slice(0,12).map(r=>`<div class="card report-card" data-report="${esc(r.id)}">${photoHTML(r)}<b>${esc(r.category)}</b><div class="muted">${esc(r.beach_name||r.location)}</div></div>`).join('')}</div>`:'';
 }catch(e){document.querySelector('#mapMsg').innerHTML=notice(e.message,'error')}
}

/* DASHBOARD */
async function dashboardPage(){state.page='dashboard';layout(`<section class="section"><h1>O3Life dashboard</h1><p class="muted">Live database statistics.</p><div id="dash" class="grid"></div></section>`);try{await loadDashboard();const d=state.dashboard;document.querySelector('#dash').innerHTML=`<div class="card stat"><strong>${d.total||0}</strong><span>Total reports</span></div><div class="card stat"><strong>${d.active||0}</strong><span>Active</span></div><div class="card stat"><strong>${d.resolved||0}</strong><span>Resolved</span></div><div class="card stat"><strong>${d.locations||0}</strong><span>Reported beaches</span></div>`}catch(e){document.querySelector('#dash').innerHTML=notice(e.message,'error')}}

/* ACCOUNT */
function accountPage(){if(!requireLogin())return;state.page='account';layout(`<section class="section"><h1>My account</h1><div class="card"><p><b>Name:</b> ${esc(state.user.name)}</p><p><b>Email:</b> ${esc(state.user.email)}</p><p><b>Role:</b> ${esc(state.user.role)}</p></div></section>`)}

/* ADMIN */
async function adminPage(){if(!isAdmin()){go('login');return}state.page='admin';layout(`<section class="section"><h1>Admin console</h1><div id="adminStats" class="grid"></div><div class="tabs"><button class="active" data-tab="reports">Reports</button><button data-tab="users">Users & roles</button></div><div id="adminContent" class="card">Loading…</div></section>`);try{await loadDashboard();document.querySelector('#adminStats').innerHTML=`<div class="card stat"><strong>${state.dashboard.total||0}</strong><span>Total reports</span></div><div class="card stat"><strong>${state.dashboard.resolved||0}</strong><span>Resolved</span></div><div class="card stat"><strong>${state.dashboard.contributors||0}</strong><span>Users</span></div>`;await renderAdminReports()}catch(e){document.querySelector('#adminContent').innerHTML=notice(e.message,'error')}}
async function renderAdminReports(){await loadReports();const el=document.querySelector('#adminContent');if(!state.reports.length){el.innerHTML='<div class="empty">No reports yet.</div>';return}el.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Report</th><th>Beach</th><th>Photo</th><th>Verification</th><th>Operations</th></tr></thead><tbody>${state.reports.map(r=>`<tr><td><b>${esc(r.id)}</b><br>${esc(r.category)}</td><td>${esc(r.beach_name||r.location)}</td><td>${r.image_url?'<span class="badge">Photo</span>':'—'}</td><td><span class="badge ${esc(r.verification_status)}">${esc(r.verification_status)}</span><br><small>${r.true_votes||0} true · ${r.false_votes||0} false</small></td><td><select data-status-id="${esc(r.id)}">${['Submitted','Assigned','Resolved'].map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select> <button class="btn secondary" data-save-status="${esc(r.id)}">Save</button></td></tr>`).join('')}</tbody></table></div>`}
async function renderAdminUsers(){const el=document.querySelector('#adminContent');try{const users=await api('/api/admin/users');el.innerHTML=users.length?`<div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Reports</th><th>Joined</th><th>Change role</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><span class="badge">${esc(u.role)}</span></td><td>${esc(u.reports_filed)}</td><td>${esc(u.created_at)}</td><td><select data-role-id="${u.id}"><option value="user" ${u.role==='user'?'selected':''}>User</option><option value="employee" ${u.role==='employee'?'selected':''}>Employee</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select> <button class="btn secondary" data-save-role="${u.id}">Save</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No users.</div>'}catch(e){el.innerHTML=notice(e.message,'error')}}
async function saveStatus(id){const select=document.querySelector(`[data-status-id="${CSS.escape(id)}"]`);try{await api('/api/reports/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({status:select.value})});await renderAdminReports()}catch(e){alert(e.message)}}
async function saveRole(id){const select=document.querySelector(`[data-role-id="${CSS.escape(id)}"]`);try{await api('/api/admin/users/'+encodeURIComponent(id)+'/role',{method:'PUT',body:JSON.stringify({role:select.value})});await renderAdminUsers()}catch(e){alert(e.message)}}

/* ROUTING */
function go(page){state.page=page;if(page==='home')home();else if(page==='login')login();else if(page==='map')mapPage();else if(page==='dashboard')dashboardPage();else if(page==='report')reportPage();else if(page==='reports')reportsPage();else if(page==='account')accountPage();else if(page==='employee')employeePage();else if(page==='admin')adminPage()}
nav.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='logoutNav'){try{await api('/api/auth/logout',{method:'POST'})}catch(_){}state.user=null;go('home')}else if(b.id==='loginNav')go('login');else if(b.dataset.page)go(b.dataset.page)});
app.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(g.dataset.go);const a=e.target.closest('[data-auth]');if(a)renderAuth(a.dataset.auth);const t=e.target.closest('[data-tab]');if(t){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===t));t.dataset.tab==='users'?renderAdminUsers():renderAdminReports()}const s=e.target.closest('[data-save-status]');if(s)saveStatus(s.dataset.saveStatus);const role=e.target.closest('[data-save-role]');if(role)saveRole(role.dataset.saveRole);const v=e.target.closest('[data-vote-id]');if(v)voteReport(v.dataset.voteId,v.dataset.vote);const ver=e.target.closest('[data-verify-id]');if(ver)verifyReport(ver.dataset.verifyId,ver.dataset.decision);const r=e.target.closest('[data-report]');if(r){const id=r.dataset.report;const found=state.reports.find(x=>x.id===id);if(found)window.location.hash=id}});
loadSession().then(()=>go('home'));
})();
</script>
</body>
</html>
